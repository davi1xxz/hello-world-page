[auth]
site_url = "https://flow-hits.web.app"
additional_redirect_urls = ["https://flow-hits.web.app"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[functions.generate-music]
verify_jwt = true

[functions.kie-callback]
verify_jwt = false

[functions.reconcile-stuck-jobs]
# A scheduled request is authenticated with CRON_SECRET; an authenticated
# administrator may also run the recovery from the admin area.
verify_jwt = false

[functions.secure-rpc]
enabled = true
verify_jwt = false
import_map = "./functions/secure-rpc/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/secure-rpc/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/secure-rpc/*.html" ]
